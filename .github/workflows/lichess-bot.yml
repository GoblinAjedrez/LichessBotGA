name: Lichess Bot Runner

concurrency:
  group: lichess-bot-runner
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  bot-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (FIX TENACITY)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tenacity pyyaml

      - name: Install Stockfish (FIX DEFINITIVO)
        run: |
          sudo apt update
          sudo apt install -y stockfish
          mkdir -p engines
          cp $(which stockfish) engines/stockfish
          chmod +x engines/stockfish
          echo "Stockfish instalado:"
          ls -l engines/

      - name: Inject token
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          if [ -z "$LICHESS_TOKEN" ]; then
            echo "ERROR: falta LICHESS_TOKEN"
            exit 1
          fi
          sed -i "s/^token:.*/token: $LICHESS_TOKEN/" config.yml

      - name: Run bot
        run: python3 user_interface.py
