name: Lichess Bot Runner

concurrency:
  group: lichess-bot-runner
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  bot-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements.txt
          python3 -m pip install tenacity pyyaml
          python3 -m pip show tenacity
          python3 -m pip show pyyaml

      - name: Install Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          mkdir -p engines
          cp "$(command -v stockfish)" engines/stockfish
          chmod +x engines/stockfish
          echo "Stockfish instalado:"
          ls -l engines/
          engines/stockfish | head -n 1 || true

      - name: Inject token into config
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          if [ -z "$LICHESS_TOKEN" ]; then
            echo "ERROR: falta LICHESS_TOKEN"
            exit 1
          fi

          python3 << 'EOF'
          import yaml

          with open("config.yml", "r", encoding="utf-8") as f:
              config = yaml.safe_load(f) or {}

          config["token"] = "${{ secrets.LICHESS_TOKEN }}"

          with open("config.yml", "w", encoding="utf-8") as f:
              yaml.safe_dump(config, f, default_flow_style=False, sort_keys=False)

          print("Token metido en config.yml")
          EOF

      - name: Launch bot
        run: |
          python3 -c "import tenacity, yaml; print('Imports OK')"
          python3 user_interface.py
